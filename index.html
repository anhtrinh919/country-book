<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Country Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      /* ?bf= picks the body font for readability sampling (lexend | atkinson | bitter | newsreader) */
      (function () {
        var BF = { lexend: "'Lexend', sans-serif", atkinson: "'Atkinson Hyperlegible', sans-serif", bitter: "'Bitter', Georgia, serif", newsreader: "'Newsreader', Georgia, serif" };
        var m = location.search.match(/[?&]bf=([a-z]+)/);
        if (m && BF[m[1]]) document.documentElement.style.setProperty("--bodyfont", BF[m[1]]);
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: #26221d; }
      #root { min-height: 100%; }
      @media print {
        @page { size: 1588px 1123px; margin: 0; }
        body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
